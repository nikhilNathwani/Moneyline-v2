name: Verify Vercel Preview (temporary)

on:
  push:
    branches:
      - fix/vercel-zero-config

env:
  PREVIEW_URL: https://nba-moneyline-git-fix-vercel-ze-b082f8-nikhilnathwanis-projects.vercel.app

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Curl root path
        run: |
          echo "=== GET / ==="
          curl -sS -i "$PREVIEW_URL/" | head -c 2000
          echo
      - name: Curl /api/top-bets
        run: |
          echo "=== GET /api/top-bets ==="
          curl -sS -i "$PREVIEW_URL/api/top-bets" | head -c 2000
          echo
      - name: Curl /api/result-summary
        run: |
          echo "=== GET /api/result-summary ==="
          curl -sS -i "$PREVIEW_URL/api/result-summary" | head -c 2000
          echo
